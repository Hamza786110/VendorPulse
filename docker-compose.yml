services:
  backend:
    build: .
    container_name: contractguard-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  airflow:
    build: ./airflow
    container_name: contractguard-airflow
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow-data:/opt/airflow
    restart: unless-stopped

volumes:
  airflow-data: