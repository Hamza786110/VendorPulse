services:
  backend:
    build: .
    container_name: contractguard-backend
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      UPLOAD_DIR: /data/uploads
      CHROMA_PERSIST_DIR: /data/chroma_db
    volumes:
      - upload-data:/data/uploads
      - chroma-data:/data/chroma_db
    restart: unless-stopped

  airflow:
    build: ./airflow
    container_name: contractguard-airflow
    command: bash -c "rm -f /opt/airflow/airflow-webserver.pid /opt/airflow/airflow-webserver-monitor.pid && airflow standalone"
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      PYTHONPATH: /opt/airflow/project
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      # reuse the existing email code instead of copying it
      - ./auth:/opt/airflow/project/auth:ro
      - ./contracts:/opt/airflow/project/contracts:ro
      - airflow-data:/opt/airflow
    restart: unless-stopped

volumes:
  airflow-data:
  chroma-data:
  upload-data: